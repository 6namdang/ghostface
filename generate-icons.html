<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Icon Generator - FaceHelper</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            padding: 2rem;
            background: #f7fafc;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        h1 { margin-bottom: 1rem; }
        p { color: #718096; margin-bottom: 2rem; }
        .icons {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }
        .icon-box {
            text-align: center;
            padding: 1rem;
            background: #f7fafc;
            border-radius: 8px;
        }
        .icon-box canvas {
            display: block;
            margin: 0 auto 0.5rem;
            border-radius: 16px;
        }
        .icon-box label {
            font-size: 0.875rem;
            color: #4a5568;
        }
        a { 
            color: #667eea; 
            text-decoration: none;
            font-weight: 500;
        }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎨 Icon Generator</h1>
        <p>Right-click each icon and select "Save image as..." to download the PNG files.</p>
        
        <div class="icons" id="icons"></div>
        
        <p>
            <strong>Instructions:</strong><br>
            1. Right-click on each icon above<br>
            2. Select "Save image as..."<br>
            3. Save with the filename shown below each icon<br>
            4. Place all icons in the <code>icons/</code> folder
        </p>
    </div>

    <script>
        const sizes = [72, 96, 128, 144, 152, 192, 384, 512];
        
        function drawIcon(canvas, size) {
            const ctx = canvas.getContext('2d');
            canvas.width = size;
            canvas.height = size;
            
            // Background gradient
            const gradient = ctx.createLinearGradient(0, 0, size, size);
            gradient.addColorStop(0, '#667eea');
            gradient.addColorStop(1, '#5a67d8');
            
            // Rounded rectangle background
            const radius = size * 0.125;
            ctx.beginPath();
            ctx.moveTo(radius, 0);
            ctx.lineTo(size - radius, 0);
            ctx.quadraticCurveTo(size, 0, size, radius);
            ctx.lineTo(size, size - radius);
            ctx.quadraticCurveTo(size, size, size - radius, size);
            ctx.lineTo(radius, size);
            ctx.quadraticCurveTo(0, size, 0, size - radius);
            ctx.lineTo(0, radius);
            ctx.quadraticCurveTo(0, 0, radius, 0);
            ctx.closePath();
            ctx.fillStyle = gradient;
            ctx.fill();
            
            // Head circle (face)
            const headRadius = size * 0.167;
            const headY = size * 0.365;
            ctx.beginPath();
            ctx.arc(size / 2, headY, headRadius, 0, Math.PI * 2);
            ctx.fillStyle = 'white';
            ctx.fill();
            
            // Body (shoulders)
            ctx.beginPath();
            const bodyTop = size * 0.573;
            const bodyBottom = size * 0.833;
            const bodyLeft = size * 0.260;
            const bodyRight = size * 0.740;
            ctx.moveTo(bodyLeft, bodyBottom);
            ctx.quadraticCurveTo(bodyLeft, bodyTop, size / 2, bodyTop);
            ctx.quadraticCurveTo(bodyRight, bodyTop, bodyRight, bodyBottom);
            ctx.fillStyle = 'white';
            ctx.fill();
            
            // Inner circle (subtle detail)
            const innerRadius = size * 0.115;
            ctx.beginPath();
            ctx.arc(size / 2, headY, innerRadius, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(102, 126, 234, 0.2)';
            ctx.fill();
        }
        
        const container = document.getElementById('icons');
        
        sizes.forEach(size => {
            const box = document.createElement('div');
            box.className = 'icon-box';
            
            const canvas = document.createElement('canvas');
            drawIcon(canvas, size);
            
            const label = document.createElement('label');
            label.textContent = `icon-${size}.png`;
            
            box.appendChild(canvas);
            box.appendChild(label);
            container.appendChild(box);
        });
    </script>
</body>
</html>
