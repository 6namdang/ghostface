<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#667eea">
    <meta name="description" content="Face recognition assistant for prosopagnosia">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="FaceHelper">
    
    <title>FaceHelper - Face Recognition Assistant</title>
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.json">
    
    <!-- Icons -->
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    
    <!-- Face-api.js (vladmandic fork - matches model URL in app.js) -->
    <script defer src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.12/dist/face-api.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #667eea;
            --primary-dark: #5a67d8;
            --secondary: #48bb78;
            --danger: #f56565;
            --text: #2d3748;
            --text-light: #718096;
            --bg: #f7fafc;
            --card: #ffffff;
            --border: #e2e8f0;
            --shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Loading Screen */
        #loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            color: white;
        }

        #loading-screen h1 {
            font-size: 2rem;
            margin-bottom: 2rem;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        #loading-progress {
            margin-top: 1.5rem;
            font-size: 0.9rem;
            opacity: 0.9;
        }

        /* Header */
        header {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            padding: 1rem;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: var(--shadow);
        }

        header h1 {
            font-size: 1.5rem;
            font-weight: 600;
        }

        /* Mode Toggle */
        .mode-toggle {
            display: flex;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            padding: 4px;
            margin-top: 1rem;
        }

        .mode-toggle button {
            flex: 1;
            padding: 0.75rem 1rem;
            border: none;
            background: transparent;
            color: white;
            font-size: 0.95rem;
            font-weight: 500;
            cursor: pointer;
            border-radius: 6px;
            transition: all 0.2s;
        }

        .mode-toggle button.active {
            background: white;
            color: var(--primary);
        }

        /* Main Container */
        main {
            padding-bottom: 80px;
        }

        /* Camera Container */
        .camera-container {
            position: relative;
            width: 100%;
            max-width: 100vw;
            background: #000;
            overflow: hidden;
        }

        #video {
            width: 100%;
            height: auto;
            display: block;
        }

        #canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        /* Overlay Controls */
        .overlay-controls {
            position: absolute;
            bottom: 1rem;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            gap: 1rem;
            padding: 0 1rem;
        }

        .overlay-btn {
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .overlay-btn.primary {
            background: white;
            color: var(--primary);
        }

        .overlay-btn.secondary {
            background: rgba(255, 255, 255, 0.9);
            color: var(--text);
        }

        .overlay-btn.danger {
            background: var(--danger);
            color: white;
        }

        /* Recognition Overlay */
        .recognition-overlay {
            position: absolute;
            top: 1rem;
            left: 1rem;
            right: 1rem;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 1rem;
            border-radius: 8px;
            font-size: 1.5rem;
            font-weight: 600;
            text-align: center;
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Enrollment Form */
        .enrollment-form {
            padding: 1.5rem;
            max-width: 500px;
            margin: 0 auto;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: var(--text);
        }

        .form-group input {
            width: 100%;
            padding: 0.875rem;
            border: 2px solid var(--border);
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.2s;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--primary);
        }

        .photo-counter {
            text-align: center;
            margin: 1.5rem 0;
            padding: 1rem;
            background: var(--card);
            border-radius: 8px;
            box-shadow: var(--shadow);
        }

        .photo-counter h3 {
            font-size: 2.5rem;
            color: var(--primary);
            margin-bottom: 0.5rem;
        }

        .photo-counter p {
            color: var(--text-light);
            font-size: 0.9rem;
        }

        .btn {
            width: 100%;
            padding: 1rem;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background: var(--primary-dark);
        }

        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-secondary {
            background: var(--card);
            color: var(--text);
            border: 2px solid var(--border);
        }

        .btn-danger {
            background: var(--danger);
            color: white;
        }

        /* Gallery */
        .gallery {
            padding: 1rem;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 1rem;
        }

        .person-card {
            background: var(--card);
            border-radius: 12px;
            padding: 1rem;
            text-align: center;
            box-shadow: var(--shadow);
            cursor: pointer;
            transition: transform 0.2s;
        }

        .person-card:hover {
            transform: translateY(-2px);
        }

        .person-avatar {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            border-radius: 50%;
            margin: 0 auto 0.75rem;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 2rem;
            font-weight: 600;
        }

        .person-card h3 {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 0.25rem;
            color: var(--text);
        }

        .person-card p {
            font-size: 0.8rem;
            color: var(--text-light);
        }

        .person-actions {
            margin-top: 0.75rem;
            display: flex;
            gap: 0.5rem;
        }

        .person-actions button {
            flex: 1;
            padding: 0.5rem;
            border: none;
            border-radius: 6px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .person-actions .edit-btn {
            background: var(--primary);
            color: white;
        }

        .person-actions .delete-btn {
            background: var(--danger);
            color: white;
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 1rem;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            background: var(--card);
            border-radius: 12px;
            padding: 1.5rem;
            max-width: 400px;
            width: 100%;
            max-height: 80vh;
            overflow-y: auto;
        }

        .modal h2 {
            margin-bottom: 1rem;
            font-size: 1.25rem;
        }

        .modal-actions {
            display: flex;
            gap: 0.75rem;
            margin-top: 1.5rem;
        }

        .modal-actions button {
            flex: 1;
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 3rem 1.5rem;
        }

        .empty-state svg {
            width: 120px;
            height: 120px;
            margin-bottom: 1.5rem;
            opacity: 0.3;
        }

        .empty-state h3 {
            font-size: 1.25rem;
            margin-bottom: 0.5rem;
            color: var(--text);
        }

        .empty-state p {
            color: var(--text-light);
            margin-bottom: 1.5rem;
        }

        /* Toast Notification */
        .toast {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--text);
            color: white;
            padding: 0.875rem 1.5rem;
            border-radius: 8px;
            font-size: 0.95rem;
            z-index: 2000;
            opacity: 0;
            transition: opacity 0.3s;
            max-width: 90%;
        }

        .toast.show {
            opacity: 1;
        }

        /* Status Bar */
        .status-bar {
            background: var(--card);
            padding: 0.75rem 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            font-size: 0.875rem;
        }

        .status-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--secondary);
        }

        .status-dot.inactive {
            background: var(--text-light);
        }

        /* Hidden */
        .hidden {
            display: none !important;
        }

        /* Responsive */
        @media (max-width: 768px) {
            header h1 {
                font-size: 1.25rem;
            }

            .mode-toggle button {
                padding: 0.6rem 0.75rem;
                font-size: 0.875rem;
            }

            .recognition-overlay {
                font-size: 1.25rem;
            }
        }
    </style>
</head>
<body>
    <!-- Loading Screen -->
    <div id="loading-screen">
        <h1>🧠 FaceHelper</h1>
        <div class="spinner"></div>
        <p id="loading-progress">Loading face recognition models...</p>
    </div>

    <!-- Main App -->
    <div id="app" class="hidden">
        <header>
            <h1>🧠 FaceHelper</h1>
            <div class="mode-toggle">
                <button id="btn-recognize" class="active" onclick="switchMode('recognize')">
                    📷 Recognize
                </button>
                <button id="btn-enroll" onclick="switchMode('enroll')">
                    ➕ Add Person
                </button>
                <button id="btn-gallery" onclick="switchMode('gallery')">
                    👥 Gallery
                </button>
            </div>
        </header>

        <main>
            <!-- Status Bar -->
            <div class="status-bar">
                <div class="status-item">
                    <div class="status-dot" id="camera-status"></div>
                    <span id="camera-status-text">Camera Off</span>
                </div>
                <div class="status-item">
                    <div class="status-dot" id="tts-status"></div>
                    <span>Audio: <span id="tts-status-text">Off</span></span>
                </div>
            </div>

            <!-- Recognition Mode -->
            <section id="recognize-mode">
                <div class="camera-container">
                    <video id="video" autoplay playsinline></video>
                    <canvas id="canvas"></canvas>
                    <div class="recognition-overlay" id="recognition-result">
                        Point camera at a face
                    </div>
                    <div class="overlay-controls">
                        <button class="overlay-btn secondary" onclick="toggleCamera()">
                            📷 Start Camera
                        </button>
                        <button class="overlay-btn secondary" onclick="toggleTTS()">
                            🔊 Audio
                        </button>
                    </div>
                </div>
            </section>

            <!-- Enrollment Mode -->
            <section id="enroll-mode" class="hidden">
                <div class="enrollment-form">
                    <div class="form-group">
                        <label for="person-name">Person's Name</label>
                        <input type="text" id="person-name" placeholder="Enter name..." autocomplete="off">
                    </div>

                    <div class="photo-counter">
                        <h3 id="photo-count">0</h3>
                        <p>photos captured</p>
                        <p style="font-size: 0.8rem; margin-top: 0.5rem;">Recommended: 5-10 photos</p>
                    </div>

                    <div class="camera-container" style="margin: 1rem 0; border-radius: 8px;">
                        <video id="enroll-video" autoplay playsinline></video>
                        <canvas id="enroll-canvas"></canvas>
                    </div>

                    <button class="btn btn-secondary" onclick="capturePhoto()" style="margin-bottom: 1rem;">
                        📸 Capture Photo
                    </button>

                    <button class="btn btn-primary" onclick="savePerson()" id="save-person-btn" disabled>
                        ✅ Save Person
                    </button>
                </div>
            </section>

            <!-- Gallery Mode -->
            <section id="gallery-mode" class="hidden">
                <div class="gallery">
                    <div id="gallery-content"></div>
                </div>
            </section>
        </main>
    </div>

    <!-- Edit Modal -->
    <div class="modal-overlay" id="edit-modal">
        <div class="modal">
            <h2>Edit Person</h2>
            <div class="form-group">
                <label for="edit-name">Name</label>
                <input type="text" id="edit-name" placeholder="Enter name...">
            </div>
            <div class="modal-actions">
                <button class="btn btn-secondary" onclick="closeEditModal()">Cancel</button>
                <button class="btn btn-primary" onclick="updatePerson()">Save</button>
            </div>
        </div>
    </div>

    <!-- Delete Confirmation Modal -->
    <div class="modal-overlay" id="delete-modal">
        <div class="modal">
            <h2>Delete Person?</h2>
            <p style="color: var(--text-light); margin-bottom: 1rem;">
                This will remove <strong id="delete-person-name"></strong> and all associated photos. This cannot be undone.
            </p>
            <div class="modal-actions">
                <button class="btn btn-secondary" onclick="closeDeleteModal()">Cancel</button>
                <button class="btn btn-danger" onclick="confirmDelete()">Delete</button>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <script src="app.js"></script>
</body>
</html>
